<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CardeLume — Secure Recovery Review 0.4.3 Step 1</title>
<style>
:root{--navy:#0b1730;--ivory:#f7f3eb;--gold:#b99762;--muted:#706a62;--line:rgba(11,23,48,.09);--serif:Georgia,'Times New Roman',serif;--sans:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% 8%,rgba(185,151,98,.10),transparent 28%),linear-gradient(180deg,#f8f4ec,#f3eee5);color:var(--navy);font-family:var(--sans);min-height:100vh}.reviewbar{position:fixed;z-index:5;left:50%;top:16px;transform:translateX(-50%);display:flex;gap:5px;padding:5px;border:1px solid var(--line);background:rgba(255,255,255,.92);border-radius:999px;box-shadow:0 12px 40px rgba(11,23,48,.08)}.reviewbar button{border:0;background:transparent;border-radius:999px;padding:9px 12px;font-size:11px;color:#756e64;cursor:pointer}.reviewbar button.on{background:var(--navy);color:white}.page{min-height:100vh;display:grid;place-items:center;padding:76px 20px 40px}.card{width:min(720px,100%);border:1px solid var(--line);border-radius:28px;background:rgba(255,253,248,.96);box-shadow:0 28px 90px rgba(11,23,48,.10);padding:34px clamp(22px,5vw,54px) 30px;text-align:center}.brand{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:12px;letter-spacing:.16em}.mark{width:32px;height:32px}.seal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;margin:24px auto 16px;background:#f3e9d9;color:#94734c;box-shadow:0 0 0 9px rgba(185,151,98,.07);font-size:20px}.eyebrow{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#917754;font-weight:700}.card h1{font-family:var(--serif);font-size:clamp(42px,7vw,66px);line-height:.98;letter-spacing:-.035em;font-weight:500;margin:11px auto 14px;max-width:620px}.intro{max-width:560px;margin:0 auto;color:var(--muted);font-size:13px;line-height:1.7}.assets{display:grid;gap:10px;margin:30px auto 0;max-width:560px}.asset{min-height:68px;border:1px solid var(--line);border-radius:16px;padding:10px 14px 10px 10px;background:white;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left}.icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:#f5efe5;color:#98764e;font-size:15px}.asset span:nth-child(2){display:flex;flex-direction:column;gap:3px}.asset strong{font-size:12px}.asset small{font-size:10px;color:#837c72}.down{font-size:16px;color:#9a7951}.foot{margin-top:28px;padding-top:18px;border-top:1px solid rgba(11,23,48,.07);display:flex;justify-content:space-between;gap:12px;color:#7a746c;font-size:9.5px;line-height:1.4}.progress{display:flex;justify-content:center;gap:7px;margin:30px 0 4px}.progress i{width:26px;height:3px;border-radius:99px;background:#b99762;animation:pulse 1.2s ease-in-out infinite}.progress i:nth-child(2){animation-delay:.16s}.progress i:nth-child(3){animation-delay:.32s}@keyframes pulse{0%,100%{opacity:.25;transform:scaleX(.8)}50%{opacity:1;transform:scaleX(1)}}.locked .seal{background:#eee9df;color:#776f66}.locked h1{font-size:clamp(36px,6vw,52px)}.reviewnote{position:fixed;right:14px;bottom:14px;max-width:300px;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.93);font-size:9px;line-height:1.5;color:#756f67;box-shadow:0 10px 30px rgba(11,23,48,.06)}@media(max-width:600px){.card{border-radius:22px;padding:28px 17px 24px}.foot{flex-direction:column}.reviewnote{display:none}.reviewbar{top:9px}.page{padding-top:65px}}
@media(prefers-reduced-motion:reduce){.progress i{animation:none;opacity:.7}}
</style>
</head>
<body>
<div class="reviewbar"><button class="on" data-state="ready">Ready</button><button data-state="preparing">Preparing</button><button data-state="locked">Access needed</button></div>
<div class="page"><main class="card" id="card"></main></div>
<div class="reviewnote"><b>Review only.</b> Production uses hashed recovery capabilities, HttpOnly cookie sessions and short-lived private R2 signed downloads. No recovery secret is stored in localStorage.</div>
<script>
const card=document.getElementById('card');
const brand=`<div class="brand"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M10 20.5c8.8 0 16 3.8 22 11.5 6-7.7 13.2-11.5 22-11.5v24c-8.2 0-15.2 3.1-22 9.5-6.8-6.4-13.8-9.5-22-9.5z" fill="none" stroke="#0b1730" stroke-width="2.2"/><path d="M32 18v28" stroke="#0b1730" stroke-width="1.7"/><circle cx="32" cy="27" r="2.3" fill="#b99762"/><path d="M32 10v7M24 18l4.3 4.3M40 18l-4.3 4.3" stroke="#b99762" stroke-width="1.7" stroke-linecap="round"/></svg><span>CARDELUME</span></div>`;
function draw(state){card.className='card '+(state==='locked'?'locked':'');if(state==='ready')card.innerHTML=brand+`<div class="seal">✓</div><div class="eyebrow">Private purchase recovery</div><h1>Your CardeLume files are safe.</h1><p class="intro">Come back to this private page whenever you need the files from this purchase.</p><div class="assets"><div class="asset"><span class="icon">JPG</span><span><strong>High-resolution JPG</strong><small>CardeLume-Birthday.jpg</small></span><span class="down">↓</span></div><div class="asset"><span class="icon">PDF</span><span><strong>Print-ready PDF</strong><small>CardeLume-Birthday.pdf</small></span><span class="down">↓</span></div></div><div class="foot"><span>🔒 Private download links expire shortly after they are created.</span><span>Recovery available until <b>Aug 27, 2027</b></span></div>`;else if(state==='preparing')card.innerHTML=brand+`<div class="seal">✓</div><div class="eyebrow">Private purchase recovery</div><h1>Your clean final is being prepared.</h1><p class="intro">Payment is confirmed. We’re finishing the private download files now; this page will update automatically.</p><div class="progress"><i></i><i></i><i></i></div><div class="foot"><span>🔒 Your purchase is already secured.</span><span>No need to pay again.</span></div>`;else card.innerHTML=brand+`<div class="seal">⌁</div><h1>Private recovery access required</h1><p class="intro">Open the secure recovery link from your purchase confirmation on this browser to restore access.</p><div class="foot"><span>Recovery links are private.</span><span>Clean files never become public.</span></div>`}
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-state]').forEach(x=>x.classList.toggle('on',x===b));draw(b.dataset.state)});draw('ready');
</script>
</body></html>
